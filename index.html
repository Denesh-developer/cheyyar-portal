<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheyyar Digital Portal</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: #0b0d13;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background: radial-gradient(circle at 10% 10%, rgba(255, 94, 58, 0.12), transparent 30%), radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.1), transparent 35%), #0b0d13;
    }
    .main-wrapper { width: 100%; max-width: 420px; text-align: center; }
    .sub-tag { font-size: 0.75rem; letter-spacing: 3px; color: #ff7a45; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
    .main-title { font-family: 'Space Grotesk', sans-serif; font-size: 2.3rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
    .desc { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin-bottom: 30px; }
    .portal-options { display: flex; flex-direction: column; gap: 16px; width: 100%; }
    .portal-card {
      display: flex; align-items: center; gap: 16px; padding: 18px 20px;
      background: rgba(22, 27, 38, 0.85); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px; text-decoration: none; color: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .portal-card:hover { transform: translateY(-3px); border-color: rgba(255, 94, 58, 0.45); }
    .card-logo-wrap { width: 62px; height: 62px; border-radius: 18px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #161b26; border: 1px solid rgba(255,255,255,0.1); }
    .card-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .bus-logo { background: linear-gradient(135deg, #ff5e3a, #b91c1c); font-size: 30px; }
    .card-info { flex: 1; text-align: left; }
    .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.18rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .card-desc { font-size: 0.82rem; color: #94a3b8; line-height: 1.4; }
    .card-arrow { color: #ff7a45; font-size: 1.4rem; font-weight: 700; }
    .footer-text { margin-top: 40px; font-size: 0.72rem; letter-spacing: 2px; color: #475569; text-transform: uppercase; font-weight: 600; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="sub-tag">Official Gateway</div>
    <h1 class="main-title">CHEYYAR PORTAL</h1>
    <p class="desc">Select your portal to continue.</p>

    <div class="portal-options">
      <!-- 1. Cheyyar Hub Selection -->
      <a href="hub.html" class="portal-card">
        <div class="card-logo-wrap">
          <img src="hub.png" alt="Cheyyar Hub">
        </div>
        <div class="card-info">
          <div class="card-title">CheyyarHub</div>
          <div class="card-desc">Town social platform, community feed, reels & chats.</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <!-- 2. Cheyyar Bus Selection -->
      <a href="bus.html" class="portal-card">
        <div class="card-logo-wrap bus-logo">
            <img src="bus.png" alt="Cheyyar Hub">
        </div>
        <div class="card-info">
          <div class="card-title">CheyyarBus</div>
          <div class="card-desc">Live schedules, route finder, 3D bus stand & timings.</div>
        </div>
        <div class="card-arrow">→</div>
      </a>
    </div>

    <div class="footer-text">Developed by Denesh &bull; Cheyyar 2026</div>
  </div>
</body>
</html>
